name: AI+Cloud 每日早报

on:
  # 每天北京时间 09:00 和 09:45 各触发一次 (UTC 01:00 / 01:45)
  # 双定时兜底：09:00 主推送成功则 09:45 自动跳过（靠 .last_run + 飞书 uuid）
  schedule:
    - cron: '0 1 * * *'    # BJT 09:00 — 主推送
    - cron: '45 1 * * *'   # BJT 09:45 — 保底（09:00 失败时补推）
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 (YYYY-MM-DD)，留空为当天'
        required: false
        type: string
      dry_run:
        description: '仅测试，不推送飞书'
        required: false
        type: boolean
        default: false
      force:
        description: '强制重跑（跳过今日已完成的检查）'
        required: false
        type: boolean
        default: false
      backfill_base:
        description: '仅回填多维表格历史记录分类/类型（不生成日报）'
        required: false
        type: boolean
        default: false
      backfill_dry_run:
        description: '回填预检：只打印分类计划，不写表格'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-news-report
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 允许 bot 提交 .last_run，避免日期标记只靠 cache（403 → git push 失败）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already ran today (双定时幂等保护)
        id: check
        run: |
          # 手动触发带 --force 时始终执行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false (force)"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          if [ -f .last_run ] && [ "$(cat .last_run)" = "$TODAY" ]; then
            echo "✅ 今日日报已于 $TODAY 完成，跳过本次触发"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip
        if: steps.check.outputs.skip == 'true'
        run: echo "已跳过"

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Run daily report
        if: steps.check.outputs.skip != 'true'
        env:
          # LLM (DeepSeek via Anthropic protocol)
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}

          # Feishu bot credentials
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

          # CI mode flag
          CI: "true"

          # Base (多维表格) token for record persistence
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}

          REPORT_RUN_MODE: ${{ github.event_name }}

        run: |
          if [ "${{ github.event.inputs.backfill_base }}" = "true" ]; then
            if [ "${{ github.event.inputs.backfill_dry_run }}" = "true" ]; then
              python3 backfill_base.py --dry-run
            else
              python3 backfill_base.py
            fi
            exit $?
          fi
          ARGS=()
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 daily_report.py "${ARGS[@]}"

      - name: Mark today as completed
        if: success() && steps.check.outputs.skip != 'true' && github.event.inputs.backfill_base != 'true' && github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.date == '')
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "$TODAY" > .last_run
          git config user.name "daily-report-bot"
          git config user.email "bot@leixumy-bot.users.github.com"
          git add .last_run
          git commit --allow-empty -m "chore: mark report done for $TODAY"
          git push || echo "⚠️ git push failed (non-fatal, 09:45 retry is protected by Feishu uuid)"
          echo "✅ 已将 .last_run 标记为 $TODAY"
