name: AI+Cloud 每日早报

on:
  # 每天北京时间 09:30 和 11:30 各触发一次 (UTC 01:30 / 03:30)
  # 双定时兜底：09:30 主推送成功则 11:30 自动跳过（靠 cache + .last_run）
  schedule:
    - cron: '30 1 * * *'   # BJT 09:30 — 主推送
    - cron: '30 3 * * *'   # BJT 11:30 — 保底（09:30 失败时补推）
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 (YYYY-MM-DD)，留空为当天'
        required: false
        type: string
      dry_run:
        description: '仅测试，不推送飞书'
        required: false
        type: boolean
        default: false
      force:
        description: '强制重跑（跳过今日已完成的检查）'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-news-report
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore .last_run from cache (幂等保护)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .last_run
          key: last-run-${{ github.ref_name }}
          restore-keys: last-run-${{ github.ref_name }}-
          enableCrossOsArchive: true

      - name: Check if already ran today (双定时幂等保护)
        id: check
        run: |
          # 手动触发带 --force 时始终执行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false (force)"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          if [ -f .last_run ] && [ "$(cat .last_run)" = "$TODAY" ]; then
            echo "✅ 今日日报已于 $TODAY 完成，跳过本次触发"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip
        if: steps.check.outputs.skip == 'true'
        run: echo "已跳过"

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install ddgs

      - name: Run daily report
        if: steps.check.outputs.skip != 'true'
        env:
          # LLM (DeepSeek via Anthropic protocol)
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}

          # Feishu bot credentials
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

          # CI mode flag
          CI: "true"

          # Base (多维表格) token for record persistence
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}

        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python3 daily_report.py $ARGS

      - name: Mark today as completed
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "$TODAY" > .last_run
          git config user.name "daily-report-bot"
          git config user.email "bot@leixumy-bot.users.github.com"
          git add .last_run
          git commit --allow-empty -m "chore: mark report done for $TODAY"
          git push || echo "⚠️ git push failed (non-fatal, cache will carry the flag)"
          echo "✅ 已将 .last_run 标记为 $TODAY"

      - name: Save .last_run to cache (幂等保底)
        if: success() && steps.check.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: .last_run
          key: last-run-${{ github.ref_name }}-${{ github.run_id }}
          enableCrossOsArchive: true
