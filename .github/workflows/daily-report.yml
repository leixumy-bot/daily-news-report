name: AI+Cloud 每日早报

on:
  # 每天北京时间 11:00 和 13:00 各触发一次 (UTC 03:00 / 05:00)
  # 双定时兜底：前一次因故未触发时，后一次补上
  schedule:
    - cron: '0 3 * * *'   # BJT 11:00
    - cron: '0 5 * * *'   # BJT 13:00 — 11:00 未触发/失败时的补救机会
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 (YYYY-MM-DD)，留空为当天'
        required: false
        type: string
      dry_run:
        description: '仅测试，不推送飞书'
        required: false
        type: boolean
        default: false
      force:
        description: '强制重跑（跳过今日已完成的检查）'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-news-report
  cancel-in-progress: false

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if already ran today (双定时幂等保护)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动触发带 --force 时始终执行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false (force)"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/variables/DAILY_REPORT_LAST_RUN" --jq '.value' 2>/dev/null || echo "")
          if [ "$LAST_RUN" = "$TODAY" ]; then
            echo "✅ 今日日报已于 $TODAY 完成，跳过本次触发"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-report:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ddgs

      - name: Run daily report
        env:
          # LLM (DeepSeek via Anthropic protocol)
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}

          # Feishu bot credentials
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

          # CI mode flag
          CI: "true"

        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python3 daily_report.py $ARGS

      - name: Mark today as completed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          gh api -X PATCH "repos/${{ github.repository }}/actions/variables/DAILY_REPORT_LAST_RUN" \
            -f name="DAILY_REPORT_LAST_RUN" -f value="$TODAY"
          echo "✅ 已将 $TODAY 标记为已完成"
